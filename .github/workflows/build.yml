name: build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

jobs:
  build:
    strategy:
      matrix:
        java: [ 17 ]
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: build
        run: |
          git clone https://github.com/perkinslr/oc2r/
          cd oc2r
          git checkout 1.18.x
          mkdir libs
          wget https://github.com/perkinslr/oc2r/download/latest/sedna.jar -O libs/sedna.jar
          ./gradlew build
          git checkout 1.20.1
          ./gradlew build
          git checkout 1.19.2
          ./gradlew build
